<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../access/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../access/css/main.css">
    <link rel="stylesheet" href="../access/css/base.css">
    <link rel="stylesheet" href="../access/css/cart.css">
    <link rel="stylesheet" href="../access/css/responsive.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght,GRAD,opsz@0..1,100..700,0..200,20..48"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="" id="header"></div>
    <div class="body">
        <div class="container-sm">
            <div class="d-grid gap-2">
                <div class="cart-box px-3 py-3" id="cart_header_row">
                    <div class="row align-items-center text-center text-muted">
                        <div class="col-md-5 text-start">
                            <div class="form-check d-inline-flex align-items-center gap-2 text-dark fw-medium">
                                <label class="form-check-label" for="all-top">Sản Phẩm</label>
                            </div>
                        </div>
                        <div class="col-md-2 d-none d-md-block">Đơn Giá</div>
                        <div class="col-md-2 d-none d-md-block">Số Lượng</div>
                        <div class="col-md-2 d-none d-md-block">Số Tiền</div>
                        <div class="col-md-1 d-none d-md-block">Thao Tác</div>
                    </div>
                </div>
                <!-- Dynamic Cart Items Container -->
                <div id="cart_items_wrapper"></div>

                <!-- Voucher sàn -->
                <section class="cart-box px-3" id="cart_voucher_section">
                    <div class="d-flex flex-wrap align-items-center gap-3 py-3">
                        <span class="fw-medium text-brown">NovaMall Voucher</span>
                        <span class="cart-plat-chip">Giảm 500.000đ (NOVAVIP500K) + Miễn phí vận chuyển</span>
                        <a href="#" class="cart-link fw-semibold ms-auto">Chọn Hoặc Nhập Mã ›</a>
                    </div>
                </section>

                <!-- Thanh thanh toán (dính đáy khi cuộn) -->
                <div class="cart-checkout" id="cart_checkout_bar">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                        <div class="d-flex flex-wrap align-items-center gap-3 small">
                            <div class="form-check d-flex align-items-center gap-2 mb-0">
                                <input class="form-check-input mt-0" type="checkbox" checked id="all-bottom">
                                <label class="form-check-label" for="all-bottom">Chọn tất cả (3)</label>
                            </div>
                            <a href="#">Xóa</a>
                            <span class="vr"></span>
                            <a href="#">Bỏ sản phẩm không hoạt động</a>
                            <span class="vr"></span>
                            <a href="#">Lưu vào mục Đã thích</a>
                        </div>

                        <div class="d-flex align-items-center gap-3 ms-auto">
                            <div class="text-end">
                                <div class="d-flex align-items-baseline justify-content-end gap-2">
                                    <span class="small"></span>
                                    <span class="cart-sum"></span>
                                </div>
                                <div class="text-muted cart-save"></div>
                            </div>
                            <button class="btn cart-buy">MUA HÀNG</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    </div>
    </div>
    <div class="" id="footer"></div>
</body>
<script src="../access/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="../access/js/home.js"></script>
<script type="module" src="../access/js/product.js"></script>
<script src="../access/js/layout.js"></script>
<script type="module" src="../access/js/cart.js"></script>
</html>
