<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../access/css/main.css">
  <link rel="stylesheet" href="../access/css/base.css">
  <link rel="stylesheet" href="../access/css/login.css">
  <link rel="stylesheet" href="../access/css/register.css">
  <link rel="stylesheet" href="../access/css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link href="../access/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="login_header">
    <div class="container login_header-content">
      <a class="login_header-logo" href="../html/index.html">
        <img src="../access/picture/screen.png" alt="" srcset="">
      </a>
      <h1 class="login_header-text">ĐĂNG KÝ</h1>
      <a href="" class="login_header_help">Bạn cần giúp đỡ?</a>
    </div>
  </div>
  <div class="login">
    <div class="container login_body">
      <div class="login_left">
        <img src="../access/picture/novamall-banner-790x747.png" alt="">
      </div>
      <div class="login_right">
        <div class="register__header">
          <div class="register__header-left">
            <h1 class="register__title">Đăng Ký Tài Khoản</h1>
            <p class="register__subtitle">Trở thành hội viên để nhận ngàn ưu đãi độc quyền và tích lũy NovaXu</p>
          </div>
        </div>
        <form class="register__form">
          <div class="register__group">
            <div class="register__label-row">
              <label class="register__label" for="fullname">HỌ VÀ TÊN ĐẦY ĐỦ <span
                  class="register__required">*</span></label>
            </div>
            <div class="register__input-wrap">
              <span class="material-symbols-outlined">person</span>
              <input type="text" id="fullname" class="register__input" placeholder="Ví dụ: Nguyễn Văn An">
            </div>
            <label class="register__error" id="fullname_error"></label>
          </div>
          <!-- SĐT hoặc email -->
          <div class="register__group">
            <div class="register__label-row">

              <label class="register__label" for="account">SỐ ĐIỆN THOẠI HOẶC EMAIL <span
                  class="register__required">*</span></label>
            </div>
            <div class="register__input-wrap">
              <span class="material-symbols-outlined">id_card_2</span>
              <input type="text" id="account" class="register__input" placeholder="0912 345 678 hoặc email@domain.com">
            </div>
            <label class="register__error" id="account_error"></label>
          </div>
          <div class="register__group">
            <div class="register__label-row">
              <label class="register__label" for="password">MẬT KHẨU BẢO MẬT <span
                  class="register__required">*</span></label>
              <span class="register__hint">Tối thiểu 8 ký tự</span>
            </div>

            <div class="register__input-wrap">
              <span class="material-symbols-outlined">lock</span>
              <input type="password" id="password" class="register__input"
                placeholder="Tạo mật khẩu từ 8 ký tự trở lên...">
            </div>
            <label class="register__error" id="password_error"></label>
          </div>
          <div class="register__group">
            <div class="register__label-row">
              <label class="register__label" for="repassword">XÁC NHẬN LẠI MẬT KHẨU <span
                  class="register__required">*</span></label>
            </div>
            <div class="register__input-wrap">
              <span class="material-symbols-outlined">lock_reset</span>
              <input type="password" id="repassword" class="register__input" placeholder="Nhập lại mật khẩu vừa tạo...">
            </div>
            <label class="register__error" id="repassword_error"></label>
          </div>
          </label>
          <button type="submit" class="login_right-bt">
            ĐĂNG KÝ TÀI KHOẢN
          </button>
          <span class="register__login-text">Đã có tài khoản? <a href="/html/login.html" class="register__login-link">
              Đăng nhập ngay</a></span>
        </form>
      </div>
    </div>
  </div>
  </div>
  <div id="footer"></div>
</body>
<script src="../access/js/layout.js"></script>
<script type="module" src="../access/js/register.js"></script>
</html>
